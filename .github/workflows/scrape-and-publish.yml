# Runs the headless-browser scraper on GitHub's machines every 3 hours, bakes what
# it finds into data/catalog.json once a day, and republishes the site. So the
# catalog grows without anyone opening a terminal.
#
# GitHub Pages cannot do this itself: it is static file hosting, no server, no
# Python. Actions is the part of GitHub that can actually run something.
#
# WHY THE CRAWL AND THE PUBLISH RUN AT DIFFERENT RATES
# ---------------------------------------------------
# Crawling often is free and good: a deeper, more varied pool to pick from.
# Publishing often is neither. Every export appends to data/catalog.json, which
# nothing ever shrinks, and dist/style-finder.html is a single file users
# download whole. At the old default of 150 per gender, exporting on all eight
# daily runs would add 2,400 rows a day — catalog.json would cross GitHub's
# 100 MB push limit in about four months and the app would stop being loadable
# long before that.
#
# So: crawl on all 8 runs, export/commit/publish on one of them (10:37 UTC).
# That is 30 rows a day, which roughly doubles the catalog over a year.
#
# TO PUBLISH ON EVERY RUN INSTEAD, set PUBLISH below to `true` and read the
# growth note above first — you almost certainly also want a size ceiling.
#
# TRIGGERING: every 3 hours, plus manual (Actions tab -> "Scrape new products"
# -> Run workflow). NOTE: `schedule:` is ignored on every branch except the
# default one — this cron does nothing until it is merged to main.
name: Scrape new products

on:
  workflow_dispatch:
    inputs:
      shops:
        description: 'How many shops to crawl (each takes ~1-2 min)'
        required: false
        default: '15'
      per_gender:
        description: 'Products to add per gender'
        required: false
        default: '15'
      dry_run:
        description: 'Crawl and test, but do not commit'
        type: boolean
        required: false
        default: false

  # Every 3 hours at :37 past the hour — 01:37, 04:37 … 22:37 UTC.
  #
  # Minute 37 rather than :00, because GitHub's own docs warn the schedule event
  # is delayed "during periods of high loads", and name "the start of every
  # hour" as one — adding that "some queued jobs may be dropped". :00, :15, :30
  # and :45 are the minutes everyone else picks. Hours listed explicitly rather
  # than */3 so that hour 0 is avoided too: 00:xx UTC carries every daily cron
  # on the platform.
  #
  # Even so, treat this as "up to 8 times a day", never as a clock. Drift of
  # hours is reported on busy days and the off-peak minute is a mitigation, not
  # a guarantee. Nothing here does wall-clock arithmetic between runs.
  #
  # Two entries, not one, so the publish run can be told apart from the other
  # seven by github.event.schedule below. The string has to match the cron
  # CHARACTER FOR CHARACTER — if you edit one, edit the other in the same
  # commit or the publish run quietly stops publishing.
  schedule:
    - cron: '37 1,4,7,13,16,19,22 * * *'   # crawl only (7 runs)
    - cron: '37 10 * * *'                  # crawl + export + commit + publish

permissions:
  contents: write        # needed to commit the new products back
  actions: write         # needed to dispatch deploy-pages.yml after the push

# One scrape at a time. The group holds one running plus one pending; a third
# trigger drops the pending one, which is the behaviour we want — skip, don't
# pile up. Without this block overlapping runs would go parallel instead.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # github.event.inputs.* is null on a schedule, and null is falsy in GitHub
      # expressions, so `||` supplies the scheduled value. Resolved once here so
      # every step agrees, and so no dispatch input is interpolated into a
      # shell line.
      SHOPS:   ${{ github.event.inputs.shops      || 15 }}
      PROMOTE: ${{ github.event.inputs.per_gender || 15 }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      # How long the crawl may spend before it stops itself. Must stay clear of
      # the Crawl step's timeout-minutes below — see the note there. The gap
      # covers the page read already in flight when the clock runs out, which is
      # the one thing the budget cannot cut short.
      CRAWL_MINUTES: 18
      # Manual runs always publish. Scheduled runs publish only on the 10:37 one.
      PUBLISH: ${{ github.event_name != 'schedule' || github.event.schedule == '37 10 * * *' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The crawl pool carries which shops answered, where both rotations
      # stopped, and every product seen so far — so a run picks up where the
      # last one left off instead of re-crawling the same first pages forever.
      #
      # catalog.db is gitignored. sites.json is tracked, but browse.py rewrites
      # it shop by shop during a crawl (that is where entry_cursor and the
      # ok/blocked health flags live) and it is only committed on the daily
      # publish run — so it has to ride the cache too, or the seven crawl-only
      # runs would re-read the same two listing pages of every shop forever.
      - name: Restore the crawl pool
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/scraper/catalog.db
            tools/scraper/sites.json
          key: crawl-pool-${{ github.run_id }}
          restore-keys: crawl-pool-

      - name: Install Python and the headless browser
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      # Only the publish run builds and tests, so only it needs the Node side.
      - name: Install Node dependencies
        if: env.PUBLISH == 'true'
        run: |
          npm ci
          npx playwright install chromium

      # Brings in labels the app doesn't carry yet. Idempotent: candidates that
      # are already registered are skipped, so on most runs this prints
      # "nothing new to probe" and costs seconds. --discover below only ever
      # finds more of the brands we already have; this is what adds new ones.
      - name: Look for brands the app doesn't carry yet
        if: env.PUBLISH == 'true'
        working-directory: tools/scraper
        run: python3 find_brands.py --write || true

      # Shops rename collections constantly; this re-reads their real men's and
      # women's department URLs. HTTP only, no browser, takes seconds — but it
      # sweeps every registered shop, so once a day rather than eight times.
      - name: Refresh the shop list
        if: env.PUBLISH == 'true'
        working-directory: tools/scraper
        run: python3 browse.py --discover --from-catalog

      # The one step every run does. browse.py commits to catalog.db shop by
      # shop, so stopping early costs at most the shop in flight.
      #
      # TWO LIMITS, AND THEY ARE NOT THE SAME KIND OF LIMIT
      # ---------------------------------------------------
      # --max-minutes is the real one: browse.py watches its own clock, stops
      # between shops, between listing pages and between product pages, and
      # exits 0. Whatever it did not reach stays at the front of the rotation.
      #
      # timeout-minutes is a backstop for one page load wedging past the budget,
      # and it has to stay comfortably above CRAWL_MINUTES or it fires first and
      # we are back to a killed step. Run #72 is why the gap is eight minutes
      # and not five: the first version of this budget only checked the clock
      # between page reads, not before starting one, and a 20-minute budget
      # still ran past the 26-minute backstop.
      #
      # This job used to have only the backstop, at 35, and no budget at all —
      # so when the registry grew to 503 shops (135 of them with a guessed
      # gender, which makes the crawler open a product page for nearly every
      # row) the crawl quietly went from 5 minutes to over 35, and *every* run
      # from 2026-08-01 was killed mid-crawl. A killed step skips everything
      # after it, so the daily export, the tests, the commit and the Pages
      # publish all stopped happening too. Hence continue-on-error: the crawl is
      # best-effort by nature — shops refuse datacenter IPs constantly — and it
      # must not be able to take the publish down with it. The step below
      # reports what actually happened.
      - name: Crawl
        id: crawl
        working-directory: tools/scraper
        timeout-minutes: 26
        continue-on-error: true
        run: |
          python3 browse.py --crawl --shops "$SHOPS" \
                            --max-minutes "$CRAWL_MINUTES" --verbose

      # Datacenter IPs get refused far more often than a home connection, so a
      # run that finishes suspiciously fast usually means the shops blocked us,
      # not that there was nothing to find. Surface that plainly — a silent
      # "0 products added" is the confusing outcome.
      - name: Report what the crawl found
        working-directory: tools/scraper
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: |
          if [ "$CRAWL_OUTCOME" != "success" ]; then
            echo "::warning::The crawl did not exit cleanly — it overran the ${CRAWL_MINUTES}-minute budget and hit the backstop, or it crashed. Publishing continues on what the pool already holds; check the Crawl step's log."
          fi
          python3 browse.py --audit || true
          python3 - <<'PY'
          import sqlite3, os, json
          if not os.path.exists('catalog.db'):
              print('::warning::No crawl pool at all — the crawl step wrote nothing.')
              raise SystemExit
          c = sqlite3.connect('catalog.db')
          n = c.execute("SELECT COUNT(*) FROM products WHERE via IS NOT NULL AND via != 'feed'").fetchone()[0]
          fresh = c.execute("SELECT COUNT(*) FROM products WHERE in_app = 0 AND via IS NOT NULL AND via != 'feed'").fetchone()[0]
          print('pool: {} browser-sourced rows, {} not yet exported'.format(n, fresh))
          reg = json.load(open('sites.json'))
          blocked = [b for b, s in reg.items() if (s.get('health') or {}).get('status') == 'blocked']
          print('shops currently marked blocked: {} of {}'.format(len(blocked), len(reg)))
          if fresh == 0:
              print('::warning::Crawl produced nothing new. The usual cause is shops '
                    'refusing GitHub-hosted runners (datacenter IPs). Running the '
                    'scraper locally normally still works — see tools/scraper/README.md.')
          PY

      # --dry-run is passed through rather than only gating the commit: without
      # it a "dry" run still writes catalog.json and marks rows in_app=1 in the
      # cached pool. export.py returns before both writes when it is set.
      - name: Bake the best of it into the catalog
        if: env.PUBLISH == 'true'
        working-directory: tools/scraper
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 export.py --promote "$PROMOTE" --dry-run
          else
            python3 export.py --promote "$PROMOTE"
          fi

      - name: Rebuild
        if: env.PUBLISH == 'true'
        run: node build.mjs

      # The gate. If the new products break anything — a mis-categorised piece in
      # the wrong deck, non-apparel slipping through, the recommender going
      # unstable — this fails and nothing is committed.
      - name: Test
        if: env.PUBLISH == 'true'
        run: npm test

      - name: Commit and publish
        id: commit
        if: env.PUBLISH == 'true' && env.DRY_RUN != 'true'
        run: |
          if git diff --quiet -- data/catalog.json tools/scraper/sites.json; then
            echo "No new products and no registry change — nothing to commit."
            exit 0
          fi
          added=$(git diff --numstat -- data/catalog.json | awk '{print $1}')
          added=${added:-0}
          if [ "$added" -gt 0 ]; then
            subject="data: +${added} products from an automated crawl"
          else
            subject="data: refresh the shop registry from an automated crawl"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json dist/style-finder.html tools/scraper/sites.json tools/scraper/stores.json
          git commit -m "${subject}

          Found by tools/scraper/browse.py and baked in by export.py.
          npm test passed before this was committed."

          # Retry against a branch that moved under us. `concurrency: scrape`
          # already stops this workflow racing itself, so the other writer can
          # only be a human and the rebase is normally clean. A conflict fails
          # loudly on purpose: export.py appends at the tail of catalog.json so
          # two appends conflict textually, and nothing is lost by stopping —
          # pick() re-derives its exclusion set from the real catalog, so the
          # abandoned rows are simply offered again next run.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Pushed: ${subject}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              echo "::error::Rebase conflict in data/catalog.json. Nothing published this run. The crawl pool is kept, so the next run re-picks these products."
              exit 1
            }
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      # A push made with GITHUB_TOKEN does not start another workflow run —
      # GitHub blocks that to prevent recursion — so deploy-pages.yml's
      # `on: push` never sees the commit above, and the site would silently
      # never update. workflow_dispatch is one of the two documented exceptions,
      # so dispatch it explicitly. Only from the default branch: dispatching it
      # from a test branch would publish that branch to Pages.
      # The scheduled case is checked first and on its own: GitHub only ever
      # runs a schedule from the default branch, so that disjunct is always the
      # true one on a cron run — and it does not depend on the event payload
      # carrying `repository`. The branch comparison exists only to stop a
      # manual dispatch-test from publishing a feature branch to Pages.
      - name: Republish the site
        if: steps.commit.outputs.pushed == 'true' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
          echo "Dispatched deploy-pages.yml — the site will republish."

      # Saved explicitly rather than by actions/cache@v4's post step, because
      # that post step is skipped whenever an earlier step fails or the job is
      # cancelled — one npm-test failure would bin the whole run's crawl.
      - name: Save the crawl pool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tools/scraper/catalog.db
            tools/scraper/sites.json
          key: crawl-pool-${{ github.run_id }}

      - name: Save the crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report-${{ github.run_id }}
          path: tools/scraper/sites.json
          if-no-files-found: ignore
